[extract_messages]
keywords = translate isPlural
add_comments = TRANSLATORS:
output_file = ckanext/test-context/i18n/ckanext-test-context.pot
width = 80

[init_catalog]
domain = ckanext-test-context
input_file = ckanext/test-context/i18n/ckanext-test-context.pot
output_dir = ckanext/test-context/i18n

[update_catalog]
domain = ckanext-test-context
input_file = ckanext/test-context/i18n/ckanext-test-context.pot
output_dir = ckanext/test-context/i18n
previous = true

[compile_catalog]
domain = ckanext-test-context
directory = ckanext/test-context/i18n
statistics = true

[flake8]
max-complexity = 100
max-line-length = 88
count = true
exit-zero = true
statistics = true
